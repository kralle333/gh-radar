[package]
name = "gh-radar"
version = "0.1.0"
edition = "2024"
description = "A gh extension to keep an eye on all your repos and their workflow runs"
license = "MIT"
authors = ["Kristian Pilegaard Jensen"]
repository = "https://github.com/kralle333/gh-radar"
readme = "README.md"
keywords = ["github", "gh-extension", "github-actions", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
